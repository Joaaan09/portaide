<!-- PortaIDE — paste inside <head>. Place the brand/ files next to your index.html (or adjust paths). -->

<!-- Favicon (browsers) -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="portaide-icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">

<!-- iOS home-screen shortcut ("Add to Home Screen") -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PortaIDE">

<!-- Android / PWA install -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0810">
<meta name="mobile-web-app-capable" content="yes">
