# PortaIDE — Nginx del frontend: sirve la PWA y hace de proxy de /api y /ws al backend.
# El TLS lo termina Nginx Proxy Manager; aquí solo escuchamos HTTP interno.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Assets con hash de Vite: cacheables a largo plazo e inmutables
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API: proxy al backend (mismo origen => cookies httpOnly sin CORS cruzado).
    # El backend ya NO corre en un contenedor: vive en el HOST como servicio
    # systemd (ver deploy/README.md). Lo alcanzamos por `host.docker.internal`,
    # que el compose mapea a la IP del host con `extra_hosts: host-gateway`.
    # proxy_pass estático (sin variable) => nginx resuelve el nombre vía /etc/hosts
    # al arrancar; no hace falta el resolver de Docker.
    location /api {
        proxy_pass http://host.docker.internal:4100;
        # Igual que `express.json({ limit: '5mb' })` del backend. El default de
        # nginx (1 MB) cortaba con 413 bodies que Express sí acepta (p.ej. guardar
        # en el Editor un archivo >1 MB), y el cliente lo veía como un fallo mudo.
        client_max_body_size 5m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSockets (terminal pty + chat claude): mismas garantías que /api pero con
    # cabeceras Upgrade y timeouts largos — una sesión de terminal o de chat puede
    # estar horas abierta sin tráfico continuo.
    location /ws {
        proxy_pass http://host.docker.internal:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # El service worker y el manifest deben revalidarse siempre, para que las
    # actualizaciones de la PWA lleguen al instante (si se cachean, el SW se "pega").
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta cae en index.html (enrutado en cliente)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
