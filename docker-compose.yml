services:
  # Frontend — PWA de Vite servida por Nginx (SPA + proxy de /api y /ws).
  #
  # El BACKEND ya NO está aquí: corre en el HOST como servicio systemd
  # (deploy/portaide-backend.service). Motivo (decisiones.md 2026-07-31): así la
  # Terminal es la shell REAL del VPS (tu `clauded`, docker, logs) y el deploy se
  # puede lanzar desde la propia app. Coste: se pierde el aislamiento del backend
  # y el borde protege el VPS entero → endurecer primero (Tailscale, ver deploy/README.md).
  #
  # El nginx de este contenedor hace de proxy de /api y /ws hacia el backend del
  # host vía `host.docker.internal`, que `extra_hosts: host-gateway` resuelve a la
  # IP del host. NPM (Nginx Proxy Manager) sigue apuntando a este contenedor: su
  # config NO cambia.
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: portaide-frontend
    restart: unless-stopped
    expose:
      - "80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - reverse_proxy_network

networks:
  # Red compartida con Nginx Proxy Manager (ya existe en el servidor)
  reverse_proxy_network:
    external: true
