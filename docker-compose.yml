services:
  # Frontend — PWA de Vite servida por Nginx (SPA + proxy de /api y /ws al backend)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: portaide-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - reverse_proxy_network
      - internal

  # Backend — Node/Express + ws (API bajo /api, WebSocket bajo /ws)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: portaide-backend
    restart: unless-stopped
    expose:
      - "4100"
    environment:
      - NODE_ENV=production
      - PORT=4100
      - MONGODB_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/portaide?authSource=admin
      # Borde de seguridad (CLAUDE.md §11): firma de sesión + credencial del usuario único.
      - SESSION_SECRET=${SESSION_SECRET}
      - AUTH_EMAIL=${AUTH_EMAIL}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
      # Raíz del filesystem que ve la app (workspace por defecto). Ampliable, pero
      # solo se puede navegar lo que esté montado abajo.
      - FS_ROOT=/home/kuoyii/servers
    # Montajes del host que necesita PortaIDE — se validan en Fase 3 al desplegar:
    # el backend toca el FS real de los proyectos y usa la config/credenciales de
    # Claude Code del host (mismo path dentro y fuera para que las rutas coincidan).
    volumes:
      - /home/kuoyii/servers:/home/kuoyii/servers
      - /home/kuoyii/.claude:/home/kuoyii/.claude
      # Descomentar SOLO si se quiere operar Docker desde la vista Terminal
      # (requiere docker CLI en la imagen; precedente: Portainer ya corre así).
      # - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - internal

  # Base de datos — MongoDB con autenticación y volumen persistente
  mongo:
    image: mongo:7
    container_name: portaide-mongo
    restart: unless-stopped
    # Expuesto SOLO al loopback del host para `npm run dev` local, en 27018
    # (¡27017 del loopback ya lo ocupa smartpeak-mongo!). NO accesible desde
    # fuera del VPS. Quítalo si dejas de usar dev local.
    ports:
      - "127.0.0.1:27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=portaide
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - portaide_mongo_data:/data/db
    networks:
      - internal

networks:
  # Red compartida con Nginx Proxy Manager (ya existe en el servidor)
  reverse_proxy_network:
    external: true
  # Red privada interna del proyecto (frontend <-> backend <-> mongo)
  internal:
    driver: bridge

volumes:
  portaide_mongo_data:
